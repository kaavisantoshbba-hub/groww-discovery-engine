
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groww AI Discovery Engine</title>
    <!-- FORCE LOAD TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'premium-black': '#080808',
                        'charcoal-surface': '#11100D',
                        'gold-primary': '#D4AF62',
                        'gold-champagne': '#F1D18A',
                        'ivory-text': '#F5F0E6',
                        'muted-gold': '#927342',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080808 !important;
            color: #F5F0E6 !important;
            font-family: 'Inter', sans-serif !important;
            margin: 0;
        }
        .font-serif { font-family: 'Playfair Display', serif !important; }
        .gold-aura {
            position: absolute; border-radius: 50%; filter: blur(120px);
            background: rgba(212, 175, 98, 0.1); pointer-events: none; z-index: 0;
        }
    </style>
</head>
<body class="bg-premium-black text-ivory-text">

    <div id="app" class="min-h-screen flex overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-charcoal-surface border-r border-gold-primary/20 flex flex-col z-20">
            <div class="p-6 flex flex-col gap-2">
                <div class="text-gold-primary font-serif text-2xl font-bold tracking-tighter">Groww</div>
                <div class="text-muted-gold text-xs uppercase tracking-widest font-semibold">AI Discovery Engine</div>
            </div>
            <nav id="sidebar-nav" class="flex-1 px-4 py-4 space-y-1">
                <!-- Nav items injected by JS -->
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative overflow-y-auto bg-black custom-scrollbar">
            <div class="gold-aura" style="top: -10%; right: -10%; width: 500px; height: 500px;"></div>
            <header class="h-16 border-b border-gold-primary/20 flex items-center justify-between px-8 bg-black/50 backdrop-blur-md sticky top-0 z-10">
                <div>
                    <h1 id="page-title" class="text-lg font-serif font-medium text-ivory-text capitalize">Overview</h1>
                </div>
                <button class="bg-gold-primary text-premium-black px-3 py-1.5 rounded text-xs font-bold">Refresh Data</button>
            </header>
            <div id="content-area" class="p-8"></div>
        </main>
    </div>

    <script>
        const ALL_REVIEWS = [
            { no: "RD-1", source: "Reddit", text: "I requested to cancel my monthly SIPs...", relevance: "SIP-relevant", moment: "Wanting to pause/change/stop", reason: ["Unclear"], intent: "Get help", confidence: "High" },
            { no: "RD-4", source: "Reddit", text: "For the last 2–3 months, my monthly SIP has been failing...", relevance: "SIP-relevant", moment: "Instalment due", reason: ["Autopay problem"], intent: "Get help", confidence: "High" }
        ];

        function init() {
            renderNav();
            renderContent();
        }

        function renderNav() {
            const nav = document.getElementById('sidebar-nav');
            const items = [
                { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
                { id: 'evidence', label: 'Evidence Browser', icon: 'database' },
                { id: 'quality', label: 'AI Quality Centre', icon: 'shield-check' }
            ];
            nav.innerHTML = items.map(item => `
                <button onclick="setActiveTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm ${item.id === 'overview' ? 'bg-gold-primary/10 text-gold-primary' : 'text-muted-gold'}">
                    <i data-lucide="${item.icon}" size="18"></i> ${item.label}
                </button>
            `).join('');
            lucide.createIcons();
        }

        function renderContent() {
            const area = document.getElementById('content-area');
            area.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-charcoal-surface border border-gold-primary/20 p-6 rounded-xl">
                        <div class="text-muted-gold text-xs uppercase">Total Records</div>
                        <div class="text-3xl font-serif font-bold text-gold-primary">511</div>
                    </div>
                    <div class="bg-charcoal-surface border border-gold-primary/20 p-6 rounded-xl">
                        <div class="text-muted-gold text-xs uppercase">SIP Relevant</div>
                        <div class="text-3xl font-serif font-bold text-gold-primary">330</div>
                    </div>
                    <div class="bg-charcoal-surface border border-gold-primary/20 p-6 rounded-xl">
                        <div class="text-muted-gold text-xs uppercase">AI Agreement</div>
                        <div class="text-3xl font-serif font-bold text-gold-primary">55%</div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        window.setActiveTab = (tab) => {
            document.getElementById('page-title').innerText = tab;
            renderContent();
        };

        init();
    </script>
</body>
</html>
