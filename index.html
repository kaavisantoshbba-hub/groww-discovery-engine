
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groww AI Discovery Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'premium-black': '#080808',
                        'charcoal-surface': '#11100D',
                        'gold-primary': '#D4AF62',
                        'gold-champagne': '#F1D18A',
                        'ivory-text': '#F5F0E6',
                        'muted-gold': '#927342',
                    },
                    backgroundImage: {
                        'gold-glow': 'radial-gradient(circle at center, rgba(212, 175, 98, 0.12) 0%, transparent 70%)',
                        'deep-gradient': 'linear-gradient(180deg, #0B0B0B 0%, #080808 100%)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080808; color: #F5F0E6; margin: 0; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-aura {
            position: absolute; border-radius: 50%; filter: blur(120px);
            background: rgba(212, 175, 98, 0.08); pointer-events: none; z-index: 0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #080808; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #D4AF62; border-radius: 10px; }
    </style>
</head>
<body class="bg-premium-black text-ivory-text overflow-hidden">

    <div id="app" class="min-h-screen flex overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-charcoal-surface border-r border-gold-primary/10 flex flex-col z-20">
            <div class="p-6 flex flex-col gap-2">
                <div class="text-gold-primary font-serif text-2xl font-bold tracking-tighter">Groww</div>
                <div class="text-muted-gold text-xs uppercase tracking-widest font-semibold">AI Discovery Engine <span class="ml-2 px-1.5 py-0.5 bg-gold-primary/20 text-gold-primary rounded text-[10px]">BETA</span></div>
            </div>
            <nav id="sidebar-nav" class="flex-1 px-4 py-4 space-y-1">
                <!-- Nav items injected by JS -->
            </nav>
            <div class="p-4 border-t border-gold-primary/10 text-[10px] text-muted-gold text-center">v4.0 Engine • Production Build</div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative overflow-y-auto bg-deep-gradient custom-scrollbar">
            <div class="gold-aura" style="top: -10%; right: -10%; width: 500px; height: 500px;"></div>
            <div class="gold-aura" style="bottom: -10%; left: -10%; width: 500px; height: 500px;"></div>

            <header class="h-16 border-b border-gold-primary/10 flex items-center justify-between px-8 bg-premium-black/50 backdrop-blur-md sticky top-0 z-10">
                <div>
                    <h1 id="page-title" class="text-lg font-serif font-medium text-ivory-text capitalize">Overview</h1>
                    <p class="text-xs text-muted-gold">Analyzing first-time investor behavior at scale</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right mr-4">
                        <div class="text-[10px] text-muted-gold uppercase tracking-tighter">Last Updated</div>
                        <div class="text-xs text-ivory-text font-mono">Nov 04, 2026</div>
                    </div>
                    <button class="bg-gold-primary text-premium-black px-3 py-1.5 rounded text-xs font-bold hover:bg-gold-champagne transition-colors">Refresh Data</button>
                </div>
            </header>

            <div id="content-area" class="p-8">
                <!-- Content dynamically injected here -->
            </div>
        </main>

        <!-- DETAIL DRAWER -->
        <div id="detail-drawer" class="fixed right-0 top-0 h-full w-full max-w-md bg-charcoal-surface border-l border-gold-primary/30 shadow-2xl z-50 p-8 translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto">
            <button onclick="closeDrawer()" class="absolute top-6 right-6 text-muted-gold hover:text-gold-primary transition-colors">Close ✕</button>
            <div id="drawer-content" class="mt-12 space-y-8"></div>
        </div>
    </div>

    <script>
        const ALL_REVIEWS = [
            { no: "RD-1", source: "Reddit", text: "I requested to cancel my monthly SIPs around Jan 25, but the Feb 1 SIP was still active and the money got deducted...", relevance: "SIP-relevant", moment: "Wanting to pause/change/stop", reason: ["Unclear"], intent: "Get help or an answer", confidence: "High" },
            { no: "RD-4", source: "Reddit", text: "For the last 2–3 months, my monthly SIP... has been failing every time. I contacted Groww support, but they couldn't resolve the issue.", relevance: "SIP-relevant", moment: "Instalment due or payment attempt", reason: ["Autopay or mandate problem", "Support didn't help"], intent: "Get help or an answer", confidence: "High" },
            { no: "RD-5", source: "Reddit", text: "Groww didn't give me an option to create a separate mandate... Groww support/chatbot is giving me conflicting advice.", relevance: "SIP-relevant", moment: "Setting up autopay", reason: ["Product gap"], intent: "Get help or an answer", confidence: "High" },
            { no: "RD-16", source: "Reddit", text: "I started an SIP... and I don't know why but it felt so small that it almost felt pointless. I went down the usual rabbit hole. YouTube videos, Reddit threads...", relevance: "SIP-relevant", moment: "Starting a SIP", reason: ["N/A"], intent: "Get help or an answer", confidence: "High" },
            { no: "PS-66", source: "Play Store", text: "tried a lot to skip my sips for a month... I recently got operated on my knee and I'm not able to go for work... the useless feature doesn't work.", relevance: "SIP-relevant", moment: "Wanting to pause/change/stop", reason: ["Financial strain", "Product gap"], intent: "Unclear", confidence: "High" },
            { no: "PS-14", source: "Play Store", text: "Big disappointing me 3 sal se sip kar rha tha... but since MF Prime came, they auto swipe my SIP... no support no nothing then i withdrawal all.", relevance: "SIP-relevant", moment: "After stopping or cancelling", reason: ["Technical issue"], intent: "Stop completely", confidence: "High" },
            { no: "YT-5", source: "YouTube", text: "Sbi mutual fund me 2000 ka sip chal raha tha lekin bo nav me credit hi nhi hua... grow ko kaafi message Kiya mail kiya koi help nahi mili", relevance: "SIP-relevant", moment: "Instalment due or payment attempt", reason: ["Technical issue", "Support didn't help"], intent: "Get help or an answer", confidence: "High" },
            { no: "PS-103", source: "Play Store", text: "Against all the MFs should be tagging/purpose/goal - Most of the people invest in SIP for specific purpose like Trip, Child Marriage...", relevance: "SIP-relevant", moment: "Unclear", reason: ["Product gap"], intent: "Suggest a feature", confidence: "High" },
            { no: "RD-26", source: "Reddit", text: "I stared at my screen during market hours today, and I honestly felt a heavy wave of anxiety... make me want to stop saving into stocks completely.", relevance: "SIP-relevant", moment: "Wanting to pause/change/stop", reason: ["Unclear"], intent: "Unclear", confidence: "Medium" },
        ];

        const GOLDEN_SET_STATS = { relevance: "18/20", moment: "15/20", reason: "17/20", intent: "12/20", overall: "55%" };
        const OPPORTUNITIES = [
            { title: "Autopay & Mandate Friction", desc: "Users face repeated failures in autopay setup and lack of manual retry options.", volume: 60, priority: "High", moment: "Instalment due or payment attempt" },
            { title: "The 'Anxiety Gap'", desc: "First-time investors exit when portfolios turn red due to lack of contextual reassurance.", volume: 42, priority: "High", moment: "Quiet months" },
            { title: "Lifecycle Management", desc: "Lack of a seamless 'Pause' or 'Flex-Amount' feature for life events (e.g., medical, moving).", volume: 38, priority: "Medium", moment: "Wanting to pause/change/stop" },
            { title: "Jargon Barrier", desc: "Confusing terminology ('minimum value') creates fear of making mistakes in the app.", volume: 25, priority: "Medium", moment: "Starting a SIP" },
            { title: "Post-Purchase Void", desc: "Lack of immediate visibility for IPO/SIP status after payment leads to distrust.", volume: 18, priority: "Low", moment: "After investing" },
        ];

        let activeTab = 'overview';
        let filter = { moment: 'All', reason: 'All' };

        function init() {
            renderNav();
            renderContent();
        }

        function renderNav() {
            const nav = document.getElementById('sidebar-nav');
            const items = [
                { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
                { id: 'opportunities', label: 'Opportunity Ranking', icon: 'trophy' },
                { id: 'journey', label: 'Investor Journey', icon: 'route' },
                { id: 'evidence', label: 'Evidence Browser', icon: 'database' },
                { id: 'quality', label: 'AI Quality Centre', icon: 'shield-check' },
                { id: 'explore', label: 'Ask & Explore', icon: 'message-square' },
            ];

            nav.innerHTML = items.map(item => `
                <button onclick="setActiveTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2 rounded-md transition-all duration-200 ${activeTab === item.id ? 'bg-gold-primary/10 text-gold-primary border-l-2 border-gold-primary' : 'text-muted-gold hover:bg-white/5 hover:text-ivory-text'}">
                    <i data-lucide="${item.icon}" size="18"></i>
                    <span class="text-sm font-medium">${item.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function setActiveTab(tab) {
            activeTab = tab;
            document.getElementById('page-title').innerText = tab.replace('_', ' ');
            renderNav();
            renderContent();
        }

        function renderContent() {
            const area = document.getElementById('content-area');
            if (activeTab === 'overview') {
                area.innerHTML = `
                    <div class="space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4">
                            ${[
                                { label: 'Total Records', val: '511', icon: 'database' },
                                { label: 'SIP Relevant', val: '330', icon: 'user-check' },
                                { label: 'Recurring Themes', val: '18', icon: 'activity' },
                                { label: 'Priority Opps', val: '6', icon: 'trophy' },
                                { label: 'AI Agreement', val: GOLDEN_SET_STATS.overall, icon: 'shield-check' },
                                { label: 'Sources', val: '7', icon: 'external-link' },
                            ].map(kpi => `
                                <div class="bg-charcoal-surface border border-gold-primary/20 p-4 rounded-lg shadow-gold-glow hover:border-gold-primary/50 transition-all group">
                                    <div class="flex justify-between items-start mb-2">
                                        <i data-lucide="${kpi.icon}" size="16" class="text-gold-primary"></i>
                                        <div class="text-[10px] text-muted-gold uppercase font-bold">Verified</div>
                                    </div>
                                    <div class="text-2xl font-serif font-bold text-ivory-text">${kpi.val}</div>
                                    <div class="text-[11px] text-muted-gold uppercase tracking-wide">${kpi.label}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 bg-charcoal-surface border border-gold-primary/20 rounded-xl p-6">
                                <h2 class="text-xl font-serif text-gold-primary mb-6">Top Opportunity Areas</h2>
                                <div class="space-y-3">
                                    ${OPPORTUNITIES.map((opp, i) => `
                                        <div class="flex items-center gap-4 p-3 bg-premium-black/50 border border-gold-primary/10 rounded-lg hover:border-gold-primary/40 transition-all cursor-pointer">
                                            <div class="w-8 h-8 rounded-full bg-gold-primary/10 text-gold-primary flex items-center justify-center font-serif font-bold">${i+1}</div>
                                            <div class="flex-1">
                                                <div class="flex items-center gap-2">
                                                    <span class="text-sm font-medium text-ivory-text">${opp.title}</span>
                                                    <span class="text-[10px] px-1.5 py-0.5 rounded ${opp.priority === 'High' ? 'bg-red-500/20 text-red-400' : 'bg-gold-primary/20 text-gold-primary'}">${opp.priority}</span>
                                                </div>
                                                <div class="text-xs text-muted-gold line-clamp-1">${opp.desc}</div>
                                            </div>
                                            <div class="text-right">
                                                <div class="text-sm font-mono text-gold-primary">${opp.volume} records</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="bg-charcoal-surface border border-gold-primary/20 rounded-xl p-6">
                                <h2 class="text-lg font-serif text-gold-primary mb-4">AI Research Assistant</h2>
                                <div class="relative mb-4">
                                    <input type="text" placeholder="Ask about SIP investors..." class="w-full bg-premium-black border border-gold-primary/20 rounded-lg px-4 py-3 text-sm text-ivory-text placeholder:text-muted-gold outline-none focus:border-gold-primary" />
                                    <i data-lucide="search" class="absolute right-3 top-3 text-muted-gold" size="18"></i>
                                </div>
                                <div class="space-y-2">
                                    ${["Why do people stop their SIP?", "What causes anxiety in Month 3?", "Unmet needs in Groww?"].map(q => `
                                        <button class="w-full text-left p-2 text-xs text-muted-gold hover:text-gold-primary hover:bg-white/5 rounded transition-all border border-transparent hover:border-gold-primary/20">${q}</button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>`;
                } else if (activeTab === 'evidence') {
                    const filtered = ALL_REVIEWS.filter(r =>
                        (filter.moment === 'All' || r.moment === filter.moment) &&
                        (filter.reason === 'All' || (r.reason && r.reason.includes(filter.reason)))
                    );
                    area.innerHTML = `
                        <div class="flex flex-wrap gap-4 items-center justify-between bg-charcoal-surface p-4 rounded-xl border border-gold-primary/20">
                            <div class="flex gap-4">
                                <div class="flex flex-col gap-1">
                                    <label class="text-[10px] uppercase text-muted-gold font-bold">Moment</label>
                                    <select onchange="updateFilter('moment', this.value)" class="bg-premium-black border border-gold-primary/20 text-xs text-ivory-text p-1.5 rounded outline-none">
                                        <option value="All">All Moments</option>
                                        <option value="Starting a SIP">Starting a SIP</option>
                                        <option value="Wanting to pause/change/stop">Wanting to Stop</option>
                                        <option value="Instalment due or payment attempt">Payment Attempt</option>
                                    </select>
                                </div>
                                <div class="flex flex-col gap-1">
                                    <label class="text-[10px] uppercase text-muted-gold font-bold">Reason</label>
                                    <select onchange="updateFilter('reason', this.value)" class="bg-premium-black border border-gold-primary/20 text-xs text-ivory-text p-1.5 rounded outline-none">
                                        <option value="All">All Reasons</option>
                                        <option value="Technical issue">Technical Issue</option>
                                        <option value="Autopay or mandate problem">Autopay Problem</option>
                                        <option value="Product gap">Product Gap</option>
                                    </select>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-muted-gold">
                                <i data-lucide="filter" size="14"></i> Showing ${filtered.length} of ${ALL_REVIEWS.length} records
                            </div>
                        </div>
                        <div class="bg-charcoal-surface border border-gold-primary/20 rounded-xl overflow-hidden">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-premium-black/50 text-muted-gold text-[11px] uppercase tracking-wider border-b border-gold-primary/10">
                                    <tr>
                                        <th class="px-6 py-3 font-semibold">ID</th>
                                        <th class="px-6 py-3 font-semibold">Review Text</th>
                                        <th class="px-6 py-3 font-semibold">Moment</th>
                                        <th class="px-6 py-3 font-semibold">Reason</th>
                                        <th class="px-6 py-3 font-semibold">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="text-sm">
                                    ${filtered.map(r => `
                                        <tr class="border-b border-gold-primary/5 hover:bg-white/5 transition-colors cursor-pointer group" onclick="openDrawer('${r.no}')">
                                            <td class="px-6 py-4 font-mono text-gold-primary text-xs">${r.no}</td>
                                            <td class="px-6 py-4 text-ivory-text max-w-md truncate">${r.text}</td>
                                            <td class="px-6 py-4"><span class="text-[10px] px-2 py-0.5 rounded-full bg-gold-primary/10 text-gold-primary border border-gold-primary/20">${r.moment}</span></td>
                                            <td class="px-6 py-4">${r.reason.map(res => `<span class="text-[10px] px-2 py-0.5 rounded-full bg-white/5 text-muted-gold border border-white/10 mr-1">${res}</span>`).join('')}</td>
                                            <td class="px-6 py-4"><button class="p-1 text-muted-gold group-hover:text-gold-primary transition-colors"><i data-lucide="external-link" size="14"></i></button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>`;
                } else if (activeTab === 'quality') {
                    area.innerHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                            ${Object.entries(GOLDEN_SET_STATS).map(([key, val], i) => `
                                <div class="bg-charcoal-surface border border-gold-primary/20 p-6 rounded-xl text-center">
                                    <div class="text-xs text-muted-gold uppercase tracking-widest mb-2">${key}</div>
                                    <div class="text-3xl font-serif font-bold text-gold-primary">${val}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="bg-charcoal-surface border border-gold-primary/20 rounded-xl p-6">
                            <h2 class="text-xl font-serif text-gold-primary mb-6 flex items-center gap-2"><i data-lucide="alert-circle" size="20"></i> Where the AI Gets It Wrong</h2>
                            <div class="space-y-4">
                                ${[
                                    { review: "PS-60", human: "Autopay Problem", ai: "Product Gap", why: "AI confused 'missing option' with 'product gap' instead of 'payment failure'." },
                                    { review: "RD-16", human: "Starting a SIP", ai: "Unclear", why: "AI failed to recognize 'felt pointless' as a mindset during the starting phase." },
                                ].map(err => `
                                    <div class="p-4 bg-premium-black rounded-lg border-l-4 border-red-500 flex gap-4">
                                        <div class="font-mono text-gold-primary text-xs w-20">${err.review}</div>
                                        <div class="flex-1 text-sm">
                                            <div class="flex gap-4 mb-1"><span class="text-muted-gold italic">Human: ${err.human}</span><span class="text-red-400 italic">AI: ${err.ai}</span></div>
                                            <div class="text-xs text-ivory-text opacity-70">${err.why}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                } else {
                    area.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-center space-y-4">
                            <div class="p-6 rounded-full bg-gold-primary/10 text-gold-primary animate-pulse"><i data-lucide="activity" size="48"></i></div>
                            <h2 class="text-2xl font-serif text-ivory-text">Section Under Construction</h2>
                            <p class="text-muted-gold max-w-md">The ${activeTab} module is being integrated with the v4 dataset. Please check the Evidence Browser for real-time data.</p>
                        </div>`;
                }
                lucide.createIcons();
            }
        }

        window.setActiveTab = setActiveTab;
        window.updateFilter = (key, val) => {
            setFilter(prev => ({ ...prev, [key]: val }));
            renderContent();
        };

        window.openDrawer = (id) => {
            const review = ALL_REVIEWS.find(r => r.no === id);
            if (!review) return;
            const drawer = document.getElementById('detail-drawer');
            const content = document.getElementById('drawer-content');
            content.innerHTML = `
                <div>
                    <div class="text-xs text-gold-primary uppercase tracking-widest mb-2">Original Evidence</div>
                    <h3 class="text-2xl font-serif text-ivory-text mb-4">${review.no}</h3>
                    <p class="text-ivory-text leading-relaxed italic opacity-90">"${review.text}"</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-3 bg-premium-black border border-gold-primary/10 rounded-lg">
                        <div class="text-[10px] text-muted-gold uppercase">Moment</div>
                        <div class="text-sm text-gold-primary">${review.moment}</div>
                    </div>
                    <div class="p-3 bg-premium-black border border-gold-primary/10 rounded-lg">
                        <div class="text-[10px] text-muted-gold uppercase">Intent</div>
                        <div class="text-sm text-gold-primary">${review.intent}</div>
                    </div>
                </div>
                <div class="p-4 bg-premium-black border border-gold-primary/10 rounded-lg">
                    <div class="text-[10px] text-muted-gold uppercase mb-2">AI Analysis & Reasoning</div>
                    <div class="text-sm text-ivory-//text opacity-80">
                        Based on the phrase <span class="text-gold-primary">"${review.text.substring(0, 30)}..."</span>, the engine identified this as a ${review.moment} event driven by ${review.reason.join(', ')}.
                    </div>
                </div>
            `;
            drawer.classList.remove('translate-x-full');
        };

        window.closeDrawer = () => {
            document.getElementById('detail-drawer').classList.add('translate-x-full');
        };

        // Initialize
        init();
    </script>
</body>
</html>
